<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="assets/images/worker.png?v=2">
    <title>Darbinieka Panelis</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/worker.css">
<style>
    #tableContainer table th,
    #tableContainer table td { text-align: center; }

    /* Pogu bāzes stāvokļi */
    #AtWork, #LeaveWork {
        background: var(--red, #c0392b) !important;
        color: #fff !important;
        border: none !important;
    }
    #startBtn, #stopBtn {
        background: var(--green) !important;
        color: #fff !important;
        border: none !important;
    }

    /* btn-inactive definēts zemāk */
</style>
<style>
    #tableContainer table th,
    #tableContainer table td { text-align: center; }
</style>
<style>
    button {
        min-height: 64px !important;
        font-size: 17px !important;
        background: var(--green) !important;
        color: #fff !important;
        border: none !important;
    }
    #logoutBtn {
        background: transparent !important;
        color: var(--muted) !important;
        border: 1px solid #d9dedb !important;
    }
    /* Pelēkais / neaktīvais stāvoklis — jābūt pēc visiem citiem button stiliem */
    button.btn-inactive {
        background: #c8ccc9 !important;
        color: #fff !important;
        border: none !important;
        cursor: not-allowed !important;
        opacity: 0.6 !important;
    }
    select, input[type="number"] {
        min-height: 60px !important;
        font-size: 17px !important;
    }
</style>

</head>
<body class="worker-page">
<style>
@media (max-width: 600px) {
    html, body { overflow: hidden !important; height: 100% !important; }
    #ieraksti, #tableContainer { display: none !important; }
    body.worker-page { padding: 5px !important; }
    .card {
        min-height: unset !important;
        margin-bottom: 0 !important;
        padding: 8px 12px !important;
        border-radius: 12px !important;
    }
    h2#welcome { font-size: 15px !important; margin: 0 0 2px !important; }
    #status { padding: 5px 8px !important; font-size: 12px !important; margin: 2px 0 !important; }
    .time-label { font-size: 11px !important; margin-bottom: 1px !important; }
    button {
        min-height: 44px !important;
        font-size: 13px !important;
        margin: 2px 0 !important;
        padding: 6px 16px !important;
        border-radius: 12px !important;
    }
    #logoutBtn { min-height: 30px !important; font-size: 11px !important; }
    select, input[type="number"] {
        min-height: 34px !important;
        font-size: 12px !important;
        margin: 2px 0 !important;
        padding: 6px !important;
    }
    #workControls { margin: 0 !important; }
}
</style>
    <div class="card">
        <h2 id="welcome"></h2>
        <div id="shiftStartTimeDisplay" class="time-label shift-time"></div>
        <div id="status">Darba diena nav sākta</div>
        <div id="workStartTimeDisplay" class="time-label work-time"></div>

        <button id="AtWork">SĀKT DIENU</button>
        <button id="startBtn">SĀKT DARBU</button>

        <div id="workControls">
            <select id="car"><option value="">-- Nav mašīnas --</option></select>
            <select id="object"><option value="">-- Nav objekta --</option></select>
            <select id="work" required><option value="">-- Izvēlies darba veidu --</option></select>
        </div>

        <button id="stopBtn">BEIGT TAGADĒJO DARBU</button>
        <button id="OpenResourceBtn" class="res-btn">REĢISTRĒT DEGVIELU / EĻĻU</button>
        <button id="LeaveWork">BEIGT DIENU</button>
        <button id="logoutBtn">Izrakstīties</button>
    </div>

    <div id="resourceModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Pievienot resursu</h3>
            <label>Ko Tu lej?</label>
            <select id="modalResourceSelect"></select>
            
            <label>Kurā mašīnā?</label>
            <select id="modalCarSelect"></select>
            
            <label id="availableLabel" style="font-size: 0.85rem; color: var(--saulstari-gray);"></label>
            <label>Daudzums (L):</label>
            <input type="number" id="modalAmountInput" step="0.1" min="0.1" placeholder="Ievadi litrus">

            <div id="mhSection" style="display:none;">
                <label>Motorstundas (mH):</label>
                <input type="number" id="modalMhInput" step="0.1" min="0" placeholder="Ievadi pašreizējo mH">
            </div>
            
            <div class="modal-actions">
                <button id="modalCancel">Atcelt</button>
                <button id="modalSave">Saglabāt</button>
            </div>
        </div>
    </div>

    <h3 id="ieraksti" tyle="text-align: center;">Tavi pēdējie darba ieraksti:</h3>
    <div id="tableContainer"></div>

<script>
    const user = JSON.parse(localStorage.getItem("loggedInUser"));
    if (!user) { window.location.href = "index.html"; } 

    document.getElementById("welcome").textContent = `Darbinieks: ${user.name}`;

    function getLatvianMonth() {
        const months = ["Janvāris", "Februāris", "Marts", "Aprīlis", "Maijs", "Jūnijs", "Jūlijs", "Augusts", "Septembris", "Oktobris", "Novembris", "Decembris"];
        return months[new Date().getMonth()];
    }

    async function loadWorkerData() {
        try {
            const [cRes, oRes, wRes, sRes, rRes] = await Promise.all([
                fetch('/api/cars'), fetch('/api/objects'), fetch('/api/work-types'), 
                fetch('/api/schedule'), fetch('/api/resource-types')
            ]);
            
            const cars = await cRes.json(); // [{id, name, track_mh}]
            window._carsData = cars;
            const objects = await oRes.json();
            window._objectsData = objects; // [{name, latitude, longitude, radius_m}]
            const workTypes = await wRes.json();
            const allSchedule = await sRes.json();
            const resources = await rRes.json();
            window._resourcesData = resources;

            // Atrodam aktīvo darbu
            const activeJob = allSchedule.find(e => 
                e.worker_name === user.name && 
                !e["beigu_laiks"] && 
                e.darbs !== "Degvielas uzpilde" && 
                e.darbs !== "Eļļas papildināšana"
            );

            // Aizpildām selectus
            fillSelect(document.getElementById("car"), cars.map(c => c.name), "-- Nav mašīnas --");
            fillSelect(document.getElementById("object"), objects.map(o => o.name || o), "-- Izvēlies objektu --");
            fillSelect(document.getElementById("work"), workTypes, "-- Izvēlies darba veidu --");

            // Noliktavas resursu ielāde
            const resModalSelect = document.getElementById("modalResourceSelect");
            resModalSelect.innerHTML = '<option value="">-- Ko Tu lej? --</option>' + 
                resources.map(r => `<option value="${r.id}" data-qty="${r.quantity}">${r.name} (Pieejams: ${r.quantity}L)</option>`).join("");

            const shiftRes = await fetch(`/api/shift-status?worker_name=${encodeURIComponent(user.name)}`);
            const shiftData = await shiftRes.json();
            const isShiftStarted = shiftData.active;
            const activeShift = shiftData.shift;

            // Elementu kontrole
            const carEl = document.getElementById("car");
            const objEl = document.getElementById("object");
            const wrkEl = document.getElementById("work");
            const shiftDisplay = document.getElementById("shiftStartTimeDisplay");
            const workTimeDisplay = document.getElementById("workStartTimeDisplay");

            // Darba dienas laika attēlošana
            if (isShiftStarted && activeShift) {
                shiftDisplay.textContent = `Ieradies darbā: ${activeShift.sāka_darbu.substring(0, 5)}`;
            } else {
                shiftDisplay.textContent = "";
            }

            // Pogu stāvokļu loģika
            function setBtn(id, active) {
                const btn = document.getElementById(id);
                if (active) {
                    btn.classList.remove('btn-inactive');
                    btn.disabled = false;
                } else {
                    btn.classList.add('btn-inactive');
                    btn.disabled = true;
                }
            }

            if (!isShiftStarted) {
                // Sākuma stāvoklis — tikai Sākt dienu aktīva
                setBtn('AtWork', true);
                setBtn('startBtn', false);
                setBtn('stopBtn', false);
                setBtn('LeaveWork', false);
                document.getElementById("status").textContent = "Darba diena nav sākta";
                workTimeDisplay.textContent = "";
                carEl.disabled = true;
                objEl.disabled = true;
                wrkEl.disabled = true;
                document.getElementById("OpenResourceBtn").classList.add('btn-inactive');
                document.getElementById("OpenResourceBtn").disabled = true;
            } else if (activeJob) {
                // Darbs aktīvs — tikai Beigt darbu zaļa, pārējās pelēkas
                setBtn('AtWork', false);
                setBtn('startBtn', false);
                setBtn('stopBtn', true);
                setBtn('LeaveWork', false);
                document.getElementById("status").innerHTML = `Strādā: <b>${activeJob.objekts || 'Birojs'}</b>`;
                workTimeDisplay.textContent = `Uzsāki šo darbu: ${activeJob.sākuma_laiks.substring(0, 5)}`;
                carEl.value = activeJob.car || '';
                objEl.value = activeJob.objekts || '';
                wrkEl.value = activeJob.darbs || '';
                carEl.disabled = true;
                objEl.disabled = true;
                wrkEl.disabled = true;
                document.getElementById("OpenResourceBtn").classList.remove('btn-inactive');
                document.getElementById("OpenResourceBtn").disabled = false;
            } else {
                // Diena sākta, nav aktīva darba — Sākt darbu zaļa, Beigt dienu sarkana
                setBtn('AtWork', false);
                setBtn('startBtn', true);
                setBtn('stopBtn', false);
                setBtn('LeaveWork', true);
                document.getElementById("status").textContent = "Darba diena ir sākta";
                workTimeDisplay.textContent = "";
                carEl.disabled = false;
                objEl.disabled = false;
                wrkEl.disabled = false;
                document.getElementById("OpenResourceBtn").classList.remove('btn-inactive');
                document.getElementById("OpenResourceBtn").disabled = false;
            }

            renderTable(allSchedule.filter(e => e.worker_name === user.name));
        } catch (err) { console.error("Kļūda:", err); }
    }

    function renderTable(data) {
    const container = document.getElementById("tableContainer");
    if (!data || !data.length) { 
        container.innerHTML = "<p style='padding:15px;'>Nav ierakstu.</p>"; 
        return; 
    }

    const exclusionList = ["Degvielas uzpilde", "Eļļas papildināšana", "Eļļas uzpilde"];

    // Izveidojam tabulas skeletu
    let html = `<table>
        <thead>
            <tr id="toggleHeader">
                <th>Datums</th>
                <th>Objekts</th>
                <th>Darbs</th>
                <th>Sākums</th>
                <th>Beigas</th>
                <th>Stundas</th>
            </tr>
        </thead>
        <tbody id="tableBody">`; // Šeit ir ID, ko paslēpsim

    const filteredData = data.filter(e => {
        const darbaVeids = e.darbs || "";
        return !exclusionList.includes(darbaVeids);
    });

    if (filteredData.length === 0) {
        container.innerHTML = "<p style='padding:15px;'>Nav veikto darbu ierakstu.</p>";
        return;
    }

    // Aizpildām rindas (jaunākie darbi augšā)
    filteredData.slice().reverse().forEach(e => {
        html += `<tr>
            <td>${e.date || '-'}</td>
            <td>${e.objekts || '-'}</td>
            <td>${e.darbs || '-'}</td>
            <td>${e["sākuma_laiks"] || '-'}</td>
            <td>${e["beigu_laiks"] || 'Aktīvs'}</td>
            <td>${e.hours ? e.hours + ' h' : '-'}</td>
        </tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;

    // PIEVIENOJAM NOTIKUMU
    const header = document.getElementById("toggleHeader");
    const body = document.getElementById("tableBody");

    header.onclick = () => {
        body.classList.toggle("hidden-rows");
    };
}

    document.getElementById("AtWork").onclick = async () => {
        const response = await fetch('/api/start-shift', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ worker_name: user.name })
        });

        if (!response.ok) {
            const err = await response.json();
            alert(err.error || "Neizdevās sākt darba dienu");
            return;
        }

        loadWorkerData();
    };

    document.getElementById("LeaveWork").onclick = async () => {
        const stopBtn = document.getElementById("stopBtn");

        if (stopBtn && !stopBtn.disabled) {
            const statusEl = document.getElementById("status");
            statusEl.style.color = "red";
            alert("Tu nevari beigt darba dienu, kamēr neesi pabeidzis aktīvo darbu!");
            setTimeout(() => { statusEl.style.color = ""; }, 3000);
            return;
        }

        if (!confirm("Beigt darba dienu un saglabāt stundas?")) return;

        try {
            const response = await fetch('/api/stop-shift', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ worker_name: user.name })
            });

            if (response.ok) {
                const data = await response.json();
                alert(`Darba diena beigta. Kopā: ${data.hours} h`);
                window.location.reload();
            } else {
                const err = await response.json();
                alert(err.error || "Kļūda saglabājot stundas!");
            }
        } catch (err) {
            alert("Servera savienojuma kļūda!");
        }
    };

    // GPS pārbaude — OBLIGĀTA, nav iespējas apiet
    function checkGpsLocation(objLat, objLng, radiusM) {
        return new Promise(resolve => {
            if (!navigator.geolocation) {
                alert("GPS nav pieejams šajā ierīcē. Nevar sākt/beigt darbu bez atrašanās vietas!");
                resolve(false);
                return;
            }

            const statusEl = document.getElementById('status');
            statusEl.textContent = '📡 Nosaka atrašanās vietu...';

            navigator.geolocation.getCurrentPosition(
                pos => {
                    const dist = getDistanceM(pos.coords.latitude, pos.coords.longitude, objLat, objLng);
                    statusEl.textContent = '';
                    if (dist <= radiusM) {
                        resolve(true);
                    } else {
                        alert(`Tu atrodas pārāk tālu no objekta! (${Math.round(dist)}m, atļautais rādiuss: ${radiusM}m). Jābūt objektā lai sāktu/beigtu darbu.`);
                        resolve(false);
                    }
                },
                err => {
                    statusEl.textContent = '';
                    alert("Nevarēja noteikt atrašanās vietu. Pārbaudi vai GPS ir ieslēgts un atļauts šai lapai.");
                    resolve(false);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });
    }

    // Haversine formula — attālums metros starp diviem GPS punktiem
    function getDistanceM(lat1, lng1, lat2, lng2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    document.getElementById("startBtn").onclick = async () => {
        const now = new Date();
        const auto = document.getElementById("car").value;
        const obj = document.getElementById("object").value;
        const wrk = document.getElementById("work").value;
        if (!wrk) return alert("Izvēlies darba veidu!");

        // GPS pārbaude ja objektam ir koordinātes
        const objData = (window._objectsData || []).find(o => (o.name || o) === obj);
        if (objData && objData.latitude && objData.longitude) {
            const allowed = await checkGpsLocation(objData.latitude, objData.longitude, objData.radius_m || 200);
            if (!allowed) return; // checkGpsLocation rāda alert pats
        }
        
        const response = await fetch('/api/start-work', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                worker_name: user.name, car: auto, 
                objekts: obj, darbs: wrk, 
                start_time: `${now.toLocaleDateString('lv-LV')} ${now.toLocaleTimeString('lv-LV', {hour: '2-digit', minute:'2-digit', second:'2-digit'})}` 
            })
        });

        if (!response.ok) {
            const err = await response.json();
            alert(err.error || "Neizdevās sākt darbu");
            return;
        }

        loadWorkerData();
    };

    document.getElementById("stopBtn").onclick = async () => {
        // GPS pārbaude pirms darba beigšanas
        const objName = document.getElementById("object").value;
        const objData = (window._objectsData || []).find(o => (o.name || o) === objName);
        if (objData && objData.latitude && objData.longitude) {
            const allowed = await checkGpsLocation(objData.latitude, objData.longitude, objData.radius_m || 200);
            if (!allowed) return;
        }

        const now = new Date();
        await fetch('/api/stop-work', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                worker_name: user.name, 
                end_time: `${now.toLocaleDateString('lv-LV')} ${now.toLocaleTimeString('lv-LV', {hour: '2-digit', minute:'2-digit', second:'2-digit'})}` 
            })
        });
        // Atbloķējam laukus pirms datu pārlādes
        document.getElementById("car").disabled = false;
        document.getElementById("object").disabled = false;
        document.getElementById("work").disabled = false;
        loadWorkerData();
    };

    // --- RESURSU LOĢIKA ---

    document.getElementById("OpenResourceBtn").onclick = () => {
        const mainCarSelect = document.getElementById("car");
        const modalCarSelect = document.getElementById("modalCarSelect");
        modalCarSelect.innerHTML = mainCarSelect.innerHTML;
        modalCarSelect.value = mainCarSelect.value;

        // Ielādē pēdējo mH izvēlētajai mašīnai
        const selCar = mainCarSelect.value;
        if (selCar) {
            fetch(`/api/last-mh?car=${encodeURIComponent(selCar)}`).then(r => r.json()).then(data => {
                window._lastMh = data.mh ? parseFloat(data.mh) : null;
                const mhInput = document.getElementById("modalMhInput");
                mhInput.placeholder = window._lastMh !== null ? `Iepriekšējais: ${window._lastMh} mH` : "Ievadi pašreizējo mH";
                mhInput.min = window._lastMh !== null ? window._lastMh : 0;
            });
        }
        setTimeout(checkMhVisibility, 0);

        document.getElementById("resourceModal").style.display = "flex";
    };

    function checkMhVisibility() {
        const carName = document.getElementById("modalCarSelect").value;
        const resSelect = document.getElementById("modalResourceSelect");
        const resName = resSelect.options[resSelect.selectedIndex]?.text?.split(' (')[0] || '';
        const carData = (window._carsData || []).find(c => c.name === carName);
        const resData = (window._resourcesData || []).find(r => r.name === resName);
        const mhSection = document.getElementById("mhSection");
        const mhInput = document.getElementById("modalMhInput");
        const showMh = carData?.track_mh && resData?.track_mh;
        mhSection.style.display = showMh ? "block" : "none";
        mhInput.required = showMh;
        if (!showMh) mhInput.value = "";
    }

    document.getElementById("modalCarSelect").onchange = async function() {
        checkMhVisibility();
        const carName = this.value;
        if (carName) {
            const r = await fetch(`/api/last-mh?car=${encodeURIComponent(carName)}`);
            const data = await r.json();
            window._lastMh = data.mh ? parseFloat(data.mh) : null;
            const mhInput = document.getElementById("modalMhInput");
            mhInput.placeholder = window._lastMh !== null ? `Iepriekšējais: ${window._lastMh} mH` : "Ievadi pašreizējo mH";
            mhInput.min = window._lastMh !== null ? window._lastMh : 0;
        } else {
            window._lastMh = null;
        }
    };
    document.getElementById("modalResourceSelect").addEventListener('change', checkMhVisibility);

    document.getElementById("modalResourceSelect").onchange = function() {
        const selected = this.options[this.selectedIndex];
        const qty = selected.getAttribute("data-qty");
        const amountInput = document.getElementById("modalAmountInput");
        const label = document.getElementById("availableLabel");

        if (qty) {
            label.textContent = `Pieejams noliktavā: ${qty} L`;
            amountInput.max = qty;
        } else {
            label.textContent = "";
            amountInput.removeAttribute("max");
        }
    };

    document.getElementById("modalCancel").onclick = () => {
        document.getElementById("resourceModal").style.display = "none";
    };

    document.getElementById("modalSave").onclick = async () => {
        const resourceSelect = document.getElementById("modalResourceSelect");
        const resourceId = resourceSelect.value;
        const selectedOption = resourceSelect.options[resourceSelect.selectedIndex];
        
        const availableQty = parseFloat(selectedOption.getAttribute("data-qty"));
        const resourceName = selectedOption.text.split(' (')[0]; 
        const auto = document.getElementById("modalCarSelect").value;
        const litri = parseFloat(document.getElementById("modalAmountInput").value);

        const mhInput = document.getElementById("modalMhInput");
        const mhVal = mhInput.value !== "" ? parseFloat(mhInput.value) : null;
        const carData2 = (window._carsData || []).find(c => c.name === auto);
        const resName2 = document.getElementById("modalResourceSelect").options[document.getElementById("modalResourceSelect").selectedIndex]?.text?.split(' (')[0] || '';
        const resData2 = (window._resourcesData || []).find(r => r.name === resName2);
        const mhRequired = carData2?.track_mh && resData2?.track_mh;
        if (mhRequired && (mhVal === null || isNaN(mhVal))) {
            return alert("Šai mašīnai un resursam obligāti jāievada motorstundas (mH)!");
        }
        if (mhRequired && mhVal !== null && window._lastMh !== null && mhVal < window._lastMh) {
            return alert(`Kļūda! Ievadītais mH (${mhVal}) nevar būt mazāks par iepriekšējo (${window._lastMh})!`);
        }

        if (!resourceId || !auto || isNaN(litri) || litri <= 0) {
            return alert("Lūdzu, aizpildi visus laukus!");
        }

        if (litri > availableQty) {
            return alert(`Kļūda! Tu nevari ieliet ${litri}L, jo noliktavā ir tikai ${availableQty}L.`);
        }
        
        try {
            const response = await fetch('/api/update-resources', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    worker_name: user.name, 
                    car: auto, 
                    resource_name: resourceName, 
                    resource_amount: litri,
                    type: resourceName.includes("Degviela") ? "Degviela" : "Ella",
                    mh_current: mhVal
                })
            });

            if (!response.ok) {
                throw new Error("Serveris atgrieza kļūdu");
            }

            document.getElementById("resourceModal").style.display = "none";
            document.getElementById("modalAmountInput").value = "";
            document.getElementById("modalMhInput").value = "";
            alert(`Veiksmīgi reģistrēts: ${resourceName} (${litri} L)`);
            loadWorkerData();
        } catch (err) { 
            alert("Kļūda saglabājot datus!"); 
        }
    };

    function fillSelect(selectEl, data, defaultText) {
        const currentVal = selectEl.value;
        // Ja lauks ir disabled (notiek darbs), mēs nemainām tā saturu, lai nepazaudētu izvēli
        if (selectEl.disabled && currentVal !== "") return;

        selectEl.innerHTML = `<option value="">${defaultText}</option>`;
        data.forEach(item => {
            const opt = document.createElement("option");
            const val = typeof item === 'object' ? (item.name || item.id) : item;
            opt.value = val; opt.textContent = val;
            selectEl.appendChild(opt);
        });
        selectEl.value = currentVal;
    }

    document.getElementById("logoutBtn").onclick = () => {
        localStorage.removeItem("loggedInUser");
        window.location.href = "index.html";
    };

    loadWorkerData();
</script>
</body>
</html>
