<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="admin.png?v=2">
    
    <title>Admin Panelis</title>
    
    
    <style>
        :root {
            --sidebar-bg: #1a3025;
            --sidebar-text: #ffffff;
            --accent-gold: #c5a059;
            --bg-light: #f4f7f6;
            --active-item: rgba(197, 160, 89, 0.2);
            --danger: #dc3545;
            --success: #28a745;
            --sidebar-wide: 280px;
            --sidebar-collapsed: 60px;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: var(--bg-light); 
            color: #333;
            overflow: hidden;
        }

        /* SĀNJOSLA */
        .sidebar {
            width: var(--sidebar-wide);
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            position: relative;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        #toggle-btn {
            position: absolute;
            right: 5px; 
            top: 15px;
            width: 50px;
            height: 45px;
            z-index: 1100;
            background: var(--sidebar-bg);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #toggle-btn:hover {
            background: var(--active-item);
        }

        .sidebar.collapsed .nav-item span,
        .sidebar.collapsed .nav-label,
        .sidebar.collapsed .sidebar-header h2,
        .sidebar.collapsed .btn-all-delete span,
        .sidebar.collapsed .logout-text {
            display: none;
        }

        .sidebar-header { 
            padding: 25px; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            height: 75px;
            box-sizing: border-box;
            overflow: hidden;
            white-space: nowrap;
        }

        .sidebar-header h2 { 
            margin: 0; 
            font-size: 18px; 
            color: var(--accent-gold); 
            text-transform: uppercase; 
        }

        .nav-group { padding: 15px 0; overflow: hidden; }
        .nav-label { padding: 0 25px 10px; font-size: 11px; text-transform: uppercase; opacity: 0.5; letter-spacing: 1px; white-space: nowrap; }

        .nav-item {
            padding: 12px 20px; 
            cursor: pointer; 
            display: flex; 
            align-items: center;
            transition: 0.2s; 
            font-size: 14px;
            color: inherit;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
            margin-right: 15px;
            font-style: normal;
        }

        .sidebar.collapsed .nav-item i {
            margin-right: 0;
            width: 100%;
            font-size: 18px;
        }

        .nav-item:hover { background: var(--active-item); color: var(--accent-gold); }
        .nav-item.active { 
            border-left: 4px solid var(--accent-gold); 
            background: var(--active-item); 
            color: var(--accent-gold); 
            font-weight: bold; 
        }

        .main-content { 
            flex-grow: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column;
            min-width: 0;
        }

        header { 
            background: #fff; 
            padding: 15px 30px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            height: 75px;
            box-sizing: border-box;
        }

        .view-section { padding: 30px; display: none; }
        .view-section.active { display: block; }

        .card { 
            background: #fff; border-radius: 12px; padding: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* Atrodas ap rindu 116 tavā failā */
.table-controls {
    display: flex;
    flex-wrap: wrap; 
    gap: 10px;       
    align-items: center;
    width: 100%; /* Pievieno šo, lai konteiners aizņemtu visu platumu */
}

/* VIENĪGAIS summary-badge stils */
.summary-badge {
    background: var(--sidebar-bg);
    color: var(--accent-gold);
    padding: 8px 15px; /* Nedaudz palielināju padding labākam skatam */
    border-radius: 5px;
    font-weight: bold;
    
    /* Šīs divas rindiņas "izstums" elementu uz labo malu */
    margin-left: auto;
    display: flex;
    align-items: center;
}
        .header-filter { padding: 8px; border: 1px solid #ddd; border-radius: 5px; background: white; min-width: 120px; }

        .table-wrapper { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; background: #fafafa; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }

        .gold-val { color: #b8860b; font-weight: bold; }
        .summary-badge {
    background: var(--sidebar-bg);
    color: var(--accent-gold);
    padding: 8px 15px; /* Nedaudz palielināju padding labākam skatam */
    border-radius: 5px;
    font-weight: bold;
    
    /* Šīs divas rindiņas "izstums" elementu uz labo malu */
    margin-left: auto;
    display: flex;
    align-items: center;
}

        .btn-add { background: var(--success); color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 15px; }
        .btn-del { color: var(--danger); background: none; border: none; font-size: 1.2em; cursor: pointer; }

        .sidebar-footer {
            margin-top: auto;
            padding: 20px;
        }

        .btn-all-delete {
            width: 100%; background: #942525; color: white; border: none; 
            padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin-bottom: 10px;
            white-space: nowrap;
        }

ul {
    list-style: none;
    padding: 0;
}

li{
    display: flex;
    justify-content: space-between; /* Izstumj tekstu pa kreisi, pogu pa labi */
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid #eee;
    max-width: 90%x; /* Vari pielāgot platumu pēc vajadzības */
}
        
        .sidebar.collapsed .btn-all-delete { background: #942525; padding: 10px 0; }

        /* MOBILO IERĪČU UN PIESIENIENA EKRĀNU STILI */
@media (pointer: coarse), (max-width: 768px) {
    /* 1. SIDEBAR LABOJUMS */
    .sidebar { 
        .sidebar {
        position: fixed !important; /* Mainām no relative uz fixed */
        left: -280px;               /* Paslēpjam pa kreisi */
        top: 0;
        bottom: 0;
        width: 280px !important;    /* Fiksēts platums */
        z-index: 99999 !important;  /* Virs visa pārējā */
        transition: left 0.3s ease !important;
        
        /* Fontu palielināšana pēc tva lūguma */
        font-size: 20px !important;
    }

    /* Kad JS pievieno klasi .active vai .open (pārbaudi, kuru klasi izmanto tavs JS) */
    .sidebar.active, .sidebar.open { 
        left: 0 !important; 
        box-shadow: 10px 0 20px rgba(0,0,0,0.5) !important;
    }

    /* 2. MILZĪGI FONTI UN POGAS */
    .nav-item {
        padding: 20px 25px !important;
        font-size: 20px !important;
    }

    .nav-label {
        font-size: 16px !important;
        padding: 25px 25px 10px !important;
        opacity: 0.8 !important;
    }

    .sidebar-header h2 {
        font-size: 24px !important;
        padding: 10px 0 !important;
    }

    /* 3. GALVENAIS SATURS UN VIRSRAKSTI */
    .nav-item {
        padding: 20px 25px !important;
        font-size: 20px !important;
    }

    .current-view-title {
        font-size: 28px !important; /* Ļoti liels virsraksts */
        margin-left: 60px !important; /* Vieta burgera pogai */
    }

    header {
        height: 80px !important;
    }

    /* 4. TABULAS UN FILTRI */
    .table-controls {
        flex-direction: column !important;
        gap: 15px !important;
    }

    .header-filter {
        width: 100% !important;
        height: 55px !important; /* Augstāki lauki pirkstiem */
        font-size: 18px !important;
    }

    .summary-badge {
        width: 100% !important;
        margin-left: 0 !important;
        font-size: 22px !important; /* Izcelta kopsumma */
        padding: 15px !important;
        justify-content: center !important;
    }

    /* 5. SARAKSTI (li) */
    li {
        padding: 20px !important;
        font-size: 20px !important;
    }
}
        
    </style>
</head>
<body>

    <div class="sidebar">
        <button id="toggle-btn" onclick="toggleSidebar()">&#9776;</button>
        <div class="sidebar-header">
            <h2>SIA Admin</h2>
        </div>

        <div class="nav-group">
            <div class="nav-label">Iestatījumi</div>
            <div class="nav-item active" onclick="showView('v-workers', this)"><i>👷</i><span>Darbinieki</span></div>
            <div class="nav-item" onclick="showView('v-cars', this)"><i>🚗</i><span>Mašīnas</span></div>
            <div class="nav-item" onclick="showView('v-worktypes', this)"><i>⚒️</i><span>Darba veidi</span></div>
            <div class="nav-item" onclick="showView('v-objects', this)"><i>📍</i><span>Objekti</span></div>
            <div class="nav-item" onclick="showView('v-res', this)"><i>🛢️</i><span>Resursi</span></div>
        </div>

        <div class="nav-group">
            <div class="nav-label">Atskaites</div>
            <div class="nav-item" onclick="showView('v-report-work', this)"><i>📋</i><span>Darba gaita</span></div>
            <div class="nav-item" onclick="showView('v-report-fuel', this)"><i>⛽</i><span>Patēriņš</span></div>
            <div class="nav-item" onclick="showView('v-report-hours', this)"><i>⏱️</i><span>Darba stundas</span></div>
        </div>

        <div class="sidebar-footer">
            <button class="btn-all-delete" onclick="deleteAllData()">⚠️ <span>DZĒST VISUS DATUS</span></button>
            <button onclick="logout()" style="width: 100%; background: #444; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i>🚪</i><span class="logout-text">Iziet</span>
            </button>
        </div>
    </div>

    <div class="main-content">
        <header>
            <h3 id="current-view-title">Darbinieki</h3>
        </header>

        <main>
            <section id="v-workers" class="view-section active">
                <div class="card">
                    <button class="btn-add" onclick="addNewWorker()">+ Pievienot darbinieku</button>
                    <ul id="workerList"></ul>
                </div>
            </section>

            <section id="v-cars" class="view-section">
                <div class="card">
                    <button class="btn-add" onclick="addNewItem('/api/cars', 'Auto numurs:')">+ Pievienot auto</button>
                    <ul id="carList"></ul>
                </div>
            </section>

            <section id="v-worktypes" class="view-section">
                <div class="card">
                    <button class="btn-add" onclick="addNewItem('/api/work-types', 'Darba veids:')">+ Pievienot darba veidu</button>
                    <ul id="workList"></ul>
                </div>
            </section>

            <section id="v-objects" class="view-section">
                <div class="card">
                    <button class="btn-add" onclick="addNewItem('/api/objects', 'Objekta nosaukums:')">+ Pievienot objektu</button>
                    <ul id="objectList"></ul>
                </div>
            </section>

            <section id="v-res" class="view-section">
                <div class="card">
                    <button class="btn-add" onclick="addNewItem('/api/resource-types', 'Resursa nosaukums:', {quantity:0})">+ Jauns resursa veids</button>
                    <ul id="resourceList"></ul>
                </div>
            </section>

            <section id="v-report-work" class="view-section">
                <div class="card">
                    <div class="table-controls">
                        <select class="year-sel header-filter" onchange="renderTables()"></select>
                        <select class="month-sel header-filter" onchange="renderTables()"></select>
                        <select class="worker-sel header-filter" onchange="renderTables()"></select>
                        <select class="car-sel header-filter" onchange="renderTables()"></select>
                        <select class="object-sel header-filter" onchange="renderTables()"></select>
                        <div class="summary-badge">Kopā stundas: <span id="totalHoursValue">0</span></div>
                    </div>
                    <div id="tableContainer" class="table-wrapper"></div>
                </div>
            </section>

            <section id="v-report-fuel" class="view-section">
                <div class="card">
                    <div class="table-controls">
                        <select class="year-sel header-filter" onchange="renderTables()"></select>
                        <select class="month-sel header-filter" onchange="renderTables()"></select>
                        <select class="res-sel header-filter" onchange="renderTables()"></select>
                        <div class="summary-badge">Kopā: <span id="totalFuelValue">0</span></div>
                    </div>
                    <div id="fuelTableContainer" class="table-wrapper"></div>
                </div>
            </section>

            <section id="v-report-hours" class="view-section">
                <div class="card">
                    <div class="table-controls">
                        <select class="year-sel header-filter" onchange="renderTables()"></select>
                        <select class="month-sel header-filter" onchange="renderTables()"></select>
                        <select class="worker-sel header-filter" onchange="renderTables()"></select>
                        <div class="summary-badge">Kopā: <span id="totalDayHoursValue">0</span></div>
                    </div>
                    <div id="daySummaryContainer" class="table-wrapper"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        let workers = [], cars = [], schedule = [], workTypes = [], objects = [], daySummary = [], resourceTypes = [];
        const LV_MONTHS = ["Janvāris", "Februāris", "Marts", "Aprīlis", "Maijs", "Jūnijs", "Jūlijs", "Augusts", "Septembris", "Oktobris", "Novembris", "Decembris"];

        // SALABOTS: Noņemta dubultā 'f' burtu drukas kļūda (bija ffunction)
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('collapsed');
        }

        function showView(viewId, el) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            el.classList.add('active');
            document.getElementById('current-view-title').innerText = el.querySelector('span').innerText;
        }

        async function loadData() {
            try {
                const res = await Promise.all([
                    fetch('/api/workers'), fetch('/api/cars'), fetch('/api/schedule'),
                    fetch('/api/work-types'), fetch('/api/objects'), fetch('/api/darbastundas'),
                    fetch('/api/resource-types')
                ]);
                [workers, cars, schedule, workTypes, objects, daySummary, resourceTypes] = await Promise.all(res.map(r => r.json()));
                
                updateFilterOptions();
                renderLists();
                renderTables();
            } catch (err) { console.error(err); }
        }

        function updateFilterOptions() {
            const years = [...new Set([...schedule, ...daySummary].map(d => (d.date || d.datums || "").split('.')[2]))].filter(Boolean).sort();
            
            const fill = (selector, data, defaultText) => {
                document.querySelectorAll(selector).forEach(sel => {
                    const current = sel.value;
                    sel.innerHTML = `<option value="">${defaultText}</option>` + data.map(item => `<option value="${item}">${item}</option>`).join("");
                    sel.value = current;
                });
            };

            fill('.year-sel', years, "Visi gadi");
            fill('.month-sel', LV_MONTHS, "Visi mēneši");
            fill('.worker-sel', workers.map(w => w.name), "Visi darbinieki"); 
            fill('.car-sel', cars, "Visi auto");
            fill('.object-sel', objects, "Visi objekti");
            fill('.res-sel', resourceTypes.map(r => r.name), "Visi resursi");
        }

        function renderLists() {
            const draw = (id, data, api, key='name') => {
                const el = document.getElementById(id);
                if(el) {
                    el.innerHTML = data.map(item => `<li><span>${item[key] || item}</span><button class="btn-del" onclick="deleteItem('${api}', '${item[key] || item}')">✖</button></li>`).join("");
                }
            };

            const workerEl = document.getElementById('workerList');
if(workerEl) {
    workerEl.innerHTML = workers.map(w => {
        // 1. Noteicam, kādu tekstu rādīt (Pagaidu vai parasto)
        const label = w.temp_password ? 'Pagaidu parole:' : 'Parole:';
        
        // 2. Noteicam, kuru vērtību rādīt
        // Prioritāte ir temp_password, tad password, tad "nav iestatīta"
        const displayPass = w.temp_password || w.password || 'nav pagaidu paroles';
        
        // 3. Ja tā ir pagaidu parole, varam tai pielikt citu krāsu (piemēram, sarkanīgu)
        const codeStyle = w.temp_password 
            ? "background: #fff0f0; color: #d63384; padding: 2px 5px; border-radius: 3px; border: 1px solid #ffcccc;" 
            : "background: #eee; padding: 2px 5px; border-radius: 3px;";

        return `
            <li>
                <div>
                    <strong>${w.name}</strong> 
                    <span style="color: #888; font-size: 12px; margin-left: 10px;">
                        ${label} <code style="${codeStyle}">${displayPass}</code>
                    </span>
                </div>
                <button class="btn-del" onclick="deleteItem('/api/workers', '${w.name}')">✖</button>
            </li>
        `;
    }).join("");
}
            draw('carList', cars, '/api/cars');
            draw('workList', workTypes, '/api/work-types');
            draw('objectList', objects, '/api/objects');

            const resList = document.getElementById('resourceList');
            if(resList) {
                resList.innerHTML = resourceTypes.map(r => `
                    <li style="flex-direction:column; align-items:stretch; border-bottom: 2px solid #eee; padding-bottom:15px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <strong>${r.name}</strong> <span class="gold-val">${parseFloat(r.quantity || 0).toFixed(2)} L</span>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <input type="number" id="in-${r.id}" placeholder="Daudzums" style="flex:1">
                            <button onclick="adjustRes(${r.id}, 'add')" style="background:var(--success); color:white; border:none; border-radius:4px; padding:8px 15px;">+</button>
                            <button onclick="adjustRes(${r.id}, 'sub')" style="background:var(--danger); color:white; border:none; border-radius:4px; padding:8px 15px;">-</button>
                            <button class="btn-del" onclick="deleteItem('/api/resource-types', '${r.name}')">✖</button>
                        </div>
                    </li>`).join("");
            }
        }

        function renderTables() {
            // Darba gaita
            const workSec = document.getElementById('v-report-work');
            if (workSec) {
                let fWork = schedule.filter(e => 
                    (!workSec.querySelector('.year-sel').value || (e.date && e.date.includes(workSec.querySelector('.year-sel').value))) &&
                    (!workSec.querySelector('.month-sel').value || e.month === workSec.querySelector('.month-sel').value) &&
                    (!workSec.querySelector('.worker-sel').value || e.worker_name === workSec.querySelector('.worker-sel').value) &&
                    (!workSec.querySelector('.car-sel').value || e.car === workSec.querySelector('.car-sel').value) &&
                    (!workSec.querySelector('.object-sel').value || e.objekts === workSec.querySelector('.object-sel').value)
                );
                
                document.getElementById('totalHoursValue').innerText = fWork.reduce((s,i) => s + parseFloat(i.hours || 0), 0).toFixed(2) + " h";
                document.getElementById('tableContainer').innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Datums</th>
                                <th>Auto</th>
                                <th>Darbinieks</th>
                                <th>Objekts</th>
                                <th style="text-align: center;">Stundas</th>
                                <th style="width: 50px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${fWork.map(e => `
                                <tr>
                                    <td>${e.date}</td>
                                    <td>${e.car || '-'}</td>
                                    <td>${e.worker_name}</td>
                                    <td>${e.objekts}</td>
                                    <td style="text-align: center;" class="gold-val">${parseFloat(e.hours || 0).toFixed(2)}</td>
                                    <td><button class="btn-del" onclick="deleteScheduleItem(${e.id})">✖</button></td>
                                </tr>`).join("")}
                        </tbody>
                    </table>`;
            }

            // Patēriņš
            const fuelSec = document.getElementById('v-report-fuel');
            if (fuelSec) {
                const yearVal = fuelSec.querySelector('.year-sel')?.value;
                const monthVal = fuelSec.querySelector('.month-sel')?.value;
                const resVal = fuelSec.querySelector('.res-sel')?.value;

                let fFuel = schedule.filter(e => 
                    e.resource_amount && 
                    (!yearVal || (e.date && e.date.includes(yearVal))) &&
                    (!monthVal || e.month === monthVal) &&
                    (!resVal || e.resource_name === resVal)
                );
                
                document.getElementById('totalFuelValue').innerText = fFuel.reduce((s,i) => s + parseFloat(i.resource_amount || 0), 0).toFixed(2) + " L";
                document.getElementById('fuelTableContainer').innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Datums</th>
                                <th>Resurss</th>
                                <th style="text-align: center;">Litri</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${fFuel.map(e => `
                                <tr>
                                    <td>${e.date}</td>
                                    <td>${e.resource_name}</td>
                                    <td style="text-align: center;" class="gold-val">${e.resource_amount} L</td>
                                    <td><button class="btn-del" onclick="deleteScheduleItem(${e.id})">✖</button></td>
                                </tr>`).join("")}
                        </tbody>
                    </table>`;
            }

            // Darba stundas
            const hoursSec = document.getElementById('v-report-hours');
            if (hoursSec) {
                let fSum = daySummary.filter(e => 
                    (!hoursSec.querySelector('.year-sel').value || (e.datums && e.datums.includes(hoursSec.querySelector('.year-sel').value))) &&
                    (!hoursSec.querySelector('.month-sel').value || e.month === hoursSec.querySelector('.month-sel').value) &&
                    (!hoursSec.querySelector('.worker-sel').value || e.darbinieks === hoursSec.querySelector('.worker-sel').value)
                );
                
                document.getElementById('totalDayHoursValue').innerText = fSum.reduce((s,i) => s + parseFloat(i.stundas || 0), 0).toFixed(2) + " h";
                document.getElementById('daySummaryContainer').innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Darbinieks</th>
                                <th>Datums</th>
                                <th>Sākums</th>
                                <th>Beigas</th>
                                <th style="text-align: center;">Stundas</th>
                                <th style="width: 50px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${fSum.map(e => `
                                <tr>
                                    <td>${e.darbinieks}</td>
                                    <td>${e.datums}</td>
                                    <td>${e.sāka_darbu}</td>
                                    <td>${e.beidza_darbu}</td>
                                    <td style="text-align: center;" class="gold-val">${parseFloat(e.stundas || 0).toFixed(2)}</td>
                                    <td>
                                        ${e.id ? `<button class="btn-del" onclick="deleteHoursItem(${e.id})">✖</button>` : ''}
                                    </td>
                                </tr>`).join("")}
                        </tbody>
                    </table>`;
            }
        }

        async function deleteScheduleItem(id) { if (confirm("Dzēst ierakstu?")) { await fetch(`/api/schedule/${id}`, { method: 'DELETE' }); loadData(); } }
        async function deleteHoursItem(id) { if (confirm("Dzēst stundu ierakstu?")) { await fetch(`/api/darbastundas/${id}`, { method: 'DELETE' }); loadData(); } }
        async function deleteAllData() {
            if (confirm("DZĒST VISUS DATUS?")) {
                const confirm2 = prompt("Ierakstiet: DZĒST");
                if (confirm2 === "DZĒST") { await fetch('/api/schedule/all', { method: 'DELETE' }); loadData(); }
            }
        }

        async function addNewWorker() { 
    const name = prompt("Ievadiet darbinieka Vārdu Uzvārdu:"); 
    if (!name) return;

    const tempPassword = prompt(`Ievadiet pagaidu paroli darbiniekam ${name}:`);
    if (!tempPassword) {
        alert("Parole ir obligāta!");
        return;
    }

    try {
        const response = await fetch('/api/workers', {
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ 
                name: name, 
                temp_password: tempPassword, // Sūtam kā temp_password
                role: 'worker'
            })
        });

        if (response.ok) {
            loadData(); 
        } else {
            const errData = await response.json();
            alert("Kļūda: " + (errData.error || "neizdevās saglabāt"));
        }
    } catch (err) {
        console.error("Servera kļūda:", err);
    }
}
        
        async function addNewItem(url, msg, extra={}) { const n = prompt(msg); if(n) { await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:n, ...extra})}); loadData(); } }
        async function deleteItem(url, name) { if(confirm(`Dzēst ${name}?`)) { await fetch(`${url}/${encodeURIComponent(name)}`, {method:'DELETE'}); loadData(); } }
        async function adjustRes(id, action) { const val = parseFloat(document.getElementById(`in-${id}`).value); if(!val) return; await fetch(`/api/resource-types/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, amount:val})}); loadData(); }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }

        loadData();
    </script>
