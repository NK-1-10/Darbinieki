<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panelis - Carbon Style</title>
    <style>
        :root {
            --sidebar-bg: #1a3025;
            --sidebar-text: #ffffff;
            --accent-gold: #c5a059;
            --bg-light: #f4f7f6;
            --active-item: rgba(197, 160, 89, 0.2);
            --danger: #dc3545;
            --success: #28a745;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; display: flex; height: 100vh; 
            background: var(--bg-light); color: #333;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px; background: var(--sidebar-bg);
            color: var(--sidebar-text); display: flex; flex-direction: column;
            transition: 0.3s; flex-shrink: 0;
        }
        .sidebar-header { padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { margin: 0; font-size: 18px; color: var(--accent-gold); text-transform: uppercase; }

        .nav-group { padding: 15px 0; }
        .nav-label { padding: 0 25px 10px; font-size: 11px; text-transform: uppercase; opacity: 0.5; letter-spacing: 1px; }

        .nav-item {
            padding: 12px 25px; cursor: pointer; display: flex; align-items: center;
            transition: 0.2s; font-size: 14px;
        }
        .nav-item:hover { background: var(--active-item); color: var(--accent-gold); }
        .nav-item.active { border-left: 4px solid var(--accent-gold); background: var(--active-item); color: var(--accent-gold); font-weight: bold; }

        /* CONTENT */
        .main-content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; }
        
        header { 
            background: #fff; padding: 15px 30px; display: flex; 
            justify-content: space-between; align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .view-section { padding: 30px; display: none; }
        .view-section.active { display: block; }

        .card { 
            background: #fff; border-radius: 12px; padding: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* FILTRU STILS */
        .table-controls {
            display: flex; flex-wrap: wrap; gap: 10px;
            background: #fcfcfc; padding: 15px; border-radius: 8px;
            margin-bottom: 15px; border: 1px solid #eee; align-items: flex-end;
        }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #666; }
        
        .header-filter { padding: 8px; border: 1px solid #ddd; border-radius: 5px; background: white; min-width: 120px; }

        /* TABULAS */
        .table-wrapper { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; background: #fafafa; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        
        .gold-val { color: #b8860b; font-weight: bold; }
        .summary-badge { background: var(--sidebar-bg); color: var(--accent-gold); padding: 5px 12px; border-radius: 20px; font-weight: bold; }

        .btn-add { background: var(--success); color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 15px; width: auto; }
        .btn-del { color: var(--danger); background: none; border: none; font-size: 1.2em; cursor: pointer; transition: transform 0.1s; }
        .btn-del:hover { transform: scale(1.2); }

        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f9f9f9; align-items: center; }

        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .nav-label, .nav-item span { display: none; }
            .table-controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header"><h2>SIA Admin</h2></div>
        
        <div class="nav-group">
            <div class="nav-label">Iestatījumi</div>
            <div class="nav-item active" onclick="showView('v-workers', this)"><i>👷</i><span>Darbinieki</span></div>
            <div class="nav-item" onclick="showView('v-cars', this)"><i>🚗</i><span>Mašīnas</span></div>
            <div class="nav-item" onclick="showView('v-worktypes', this)"><i>⚒️</i><span>Darba veidi</span></div>
            <div class="nav-item" onclick="showView('v-objects', this)"><i>📍</i><span>Objekti</span></div>
            <div class="nav-item" onclick="showView('v-res', this)"><i>🛢️</i><span>Resursi</span></div>
        </div>

        <div class="nav-group">
            <div class="nav-label">Atskaites</div>
            <div class="nav-item" onclick="showView('v-report-work', this)"><i>📋</i><span>Darba gaita</span></div>
            <div class="nav-item" onclick="showView('v-report-fuel', this)"><i>⛽</i><span>Patēriņš</span></div>
            <div class="nav-item" onclick="showView('v-report-hours', this)"><i>⏱️</i><span>Darba stundas</span></div>
        </div>

        <div style="margin-top: auto; padding: 20px;">
            <button onclick="logout()" style="width: 100%; background: var(--danger); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer;">Iziet</button>
        </div>
    </div>

    <div class="main-content">
        <header>
            <h3 id="current-view-title">Darbinieki</h3>
        </header>

        <main>
            <section id="v-workers" class="view-section active"><div class="card"><button class="btn-add" onclick="addNewWorker()">➕ Pievienot darbinieku</button><ul id="workerList"></ul></div></section>
            <section id="v-cars" class="view-section"><div class="card"><button class="btn-add" onclick="addNewItem('/api/cars', 'Auto Nr.')">➕ Pievienot mašīnu</button><ul id="carList"></ul></div></section>
            <section id="v-worktypes" class="view-section"><div class="card"><button class="btn-add" onclick="addNewItem('/api/work-types', 'Veids')">➕ Pievienot veidu</button><ul id="workList"></ul></div></section>
            <section id="v-objects" class="view-section"><div class="card"><button class="btn-add" onclick="addNewItem('/api/objects', 'Objekts')">➕ Pievienot objektu</button><ul id="objectList"></ul></div></section>
            <section id="v-res" class="view-section"><div class="card"><button class="btn-add" onclick="addNewItem('/api/resource-types', 'Resurss', {quantity:0})">➕ Jauns resurss</button><ul id="resourceList"></ul></div></section>

            <section id="v-report-work" class="view-section">
                <div class="card">
                    <div class="table-controls">
                        <div class="filter-group"><label>Gads</label><select class="header-filter year-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Mēnesis</label><select class="header-filter month-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Auto</label><select class="header-filter car-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Darbinieks</label><select class="header-filter worker-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Objekts</label><select class="header-filter object-sel" onchange="renderTables()"></select></div>
                        <div style="margin-left:auto">Kopā: <span id="totalHoursValue" class="summary-badge">0.00 h</span></div>
                    </div>
                    <div class="table-wrapper" id="tableContainer"></div>
                </div>
            </section>

            <section id="v-report-fuel" class="view-section">
                <div class="card">
                    <div class="table-controls">
                        <div class="filter-group"><label>Gads</label><select class="header-filter year-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Mēnesis</label><select class="header-filter month-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Darbinieks</label><select class="header-filter worker-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Auto</label><select class="header-filter car-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Resurss</label><select class="header-filter res-sel" onchange="renderTables()"></select></div>
                        <div style="margin-left:auto">Kopā: <span id="totalFuelValue" class="summary-badge">0.00 L</span></div>
                    </div>
                    <div class="table-wrapper" id="fuelTableContainer"></div>
                </div>
            </section>

            <section id="v-report-hours" class="view-section">
                <div class="card">
                    <div class="table-controls">
                        <div class="filter-group"><label>Gads</label><select class="header-filter year-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Mēnesis</label><select class="header-filter month-sel" onchange="renderTables()"></select></div>
                        <div class="filter-group"><label>Darbinieks</label><select class="header-filter worker-sel" onchange="renderTables()"></select></div>
                        <div style="margin-left:auto">Kopā: <span id="totalDayHoursValue" class="summary-badge">0.00 h</span></div>
                    </div>
                    <div class="table-wrapper" id="daySummaryContainer"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        let workers = [], cars = [], schedule = [], workTypes = [], objects = [], daySummary = [], resourceTypes = [];
        const LV_MONTHS = ["Janvāris", "Februāris", "Marts", "Aprīlis", "Maijs", "Jūnijs", "Jūlijs", "Augusts", "Septembris", "Oktobris", "Novembris", "Decembris"];

        function showView(viewId, el) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            el.classList.add('active');
            document.getElementById('current-view-title').innerText = el.querySelector('span').innerText;
        }

        async function loadData() {
            try {
                const res = await Promise.all([
                    fetch('/api/workers'), fetch('/api/cars'), fetch('/api/schedule'),
                    fetch('/api/work-types'), fetch('/api/objects'), fetch('/api/darbastundas'),
                    fetch('/api/resource-types')
                ]);
                [workers, cars, schedule, workTypes, objects, daySummary, resourceTypes] = await Promise.all(res.map(r => r.json()));
                
                updateFilterOptions();
                renderLists();
                renderTables();
            } catch (err) { console.error(err); }
        }

        function updateFilterOptions() {
            const years = [...new Set([...schedule, ...daySummary].map(d => (d.date || d.datums || "").split('.')[2]))].filter(Boolean).sort();
            
            const fill = (selector, data, defaultText) => {
                document.querySelectorAll(selector).forEach(sel => {
                    const current = sel.value;
                    sel.innerHTML = `<option value="">${defaultText}</option>` + data.map(item => `<option value="${item}">${item}</option>`).join("");
                    sel.value = current;
                });
            };

            fill('.year-sel', years, "Visi gadi");
            fill('.month-sel', LV_MONTHS, "Visi mēneši");
            fill('.worker-sel', workers.map(w => w.name), "Visi darbinieki");
            fill('.car-sel', cars.map(c => c.name), "Visi auto");
            fill('.object-sel', objects.map(o => o.name), "Visi objekti");
            fill('.res-sel', resourceTypes.map(r => r.name), "Visi resursi");
        }

        function renderLists() {
            const draw = (id, data, api, key='name') => {
                document.getElementById(id).innerHTML = data.map(item => `<li><span>${item[key] || item}</span><button class="btn-del" onclick="deleteItem('${api}', '${item[key] || item}')">✖</button></li>`).join("");
            };
            draw('workerList', workers, '/api/workers');
            draw('carList', cars, '/api/cars');
            draw('workList', workTypes, '/api/work-types');
            draw('objectList', objects, '/api/objects');

            document.getElementById('resourceList').innerHTML = resourceTypes.map(r => `
                <li style="flex-direction:column; align-items:stretch; border-bottom: 2px solid #eee; padding-bottom:15px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <strong>${r.name}</strong> <span class="gold-val">${parseFloat(r.quantity || 0).toFixed(2)} L</span>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <input type="number" id="in-${r.id}" placeholder="Daudzums" style="flex:1">
                        <button onclick="adjustRes(${r.id}, 'add')" style="background:var(--success); color:white; border:none; border-radius:4px; padding:8px 15px;">+</button>
                        <button onclick="adjustRes(${r.id}, 'sub')" style="background:var(--danger); color:white; border:none; border-radius:4px; padding:8px 15px;">-</button>
                        <button class="btn-del" onclick="deleteItem('/api/resource-types', '${r.name}')">✖</button>
                    </div>
                </li>`).join("");
        }

        async function deleteScheduleItem(id) {
            if (confirm("Vai tiešām vēlies dzēst šo ierakstu?")) {
                try {
                    const response = await fetch(`/api/schedule/${id}`, { method: 'DELETE' });
                    if (response.ok) { loadData(); } 
                    else { alert("Kļūda dzēšot ierakstu."); }
                } catch (err) { console.error("Servera kļūda:", err); }
            }
        }

        function renderTables() {
            // 1. Darba gaitas atskaite
            const workSec = document.getElementById('v-report-work');
            let fWork = schedule.filter(e => 
                (!workSec.querySelector('.year-sel').value || (e.date && e.date.includes(workSec.querySelector('.year-sel').value))) &&
                (!workSec.querySelector('.month-sel').value || e.month === workSec.querySelector('.month-sel').value) &&
                (!workSec.querySelector('.worker-sel').value || e.worker_name === workSec.querySelector('.worker-sel').value) &&
                (!workSec.querySelector('.car-sel').value || e.car === workSec.querySelector('.car-sel').value) &&
                (!workSec.querySelector('.object-sel').value || e.objekts === workSec.querySelector('.object-sel').value)
            );
            
            document.getElementById('totalHoursValue').innerText = fWork.reduce((s,i) => s + parseFloat(i.hours || 0), 0).toFixed(2) + " h";
            document.getElementById('tableContainer').innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Datums</th>
                            <th>Auto</th>
                            <th>Darbinieks</th>
                            <th>Objekts</th>
                            <th style="text-align: center;">Stundas</th>
                            <th style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${fWork.map(e => `
                            <tr>
                                <td>${e.date}</td>
                                <td>${e.car || '-'}</td>
                                <td>${e.worker_name}</td>
                                <td>${e.objekts}</td>
                                <td style="text-align: center;" class="gold-val">${parseFloat(e.hours).toFixed(2)}</td>
                                <td><button class="btn-del" onclick="deleteScheduleItem(${e.id})">✖</button></td>
                            </tr>`).join("")}
                    </tbody>
                </table>`;

            // 2. Patēriņa atskaite
            const fuelSec = document.getElementById('v-report-fuel');
            let fFuel = schedule.filter(e => 
                e.resource_amount && 
                (!fuelSec.querySelector('.year-sel').value || (e.date && e.date.includes(fuelSec.querySelector('.year-sel').value))) &&
                (!fuelSec.querySelector('.month-sel').value || e.month === fuelSec.querySelector('.month-sel').value) &&
                (!fuelSec.querySelector('.worker-sel').value || e.worker_name === fuelSec.querySelector('.worker-sel').value) &&
                (!fuelSec.querySelector('.car-sel').value || e.car === fuelSec.querySelector('.car-sel').value) &&
                (!fuelSec.querySelector('.res-sel').value || e.resource_name === fuelSec.querySelector('.res-sel').value)
            );
            
            document.getElementById('totalFuelValue').innerText = fFuel.reduce((s,i) => s + parseFloat(i.resource_amount || 0), 0).toFixed(2) + " L";
            document.getElementById('fuelTableContainer').innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Datums</th>
                            <th>Darbinieks</th>
                            <th>Auto</th>
                            <th>Resurss</th>
                            <th style="text-align: center;">Litri</th>
                            <th style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${fFuel.map(e => `
                            <tr>
                                <td>${e.date}</td>
                                <td>${e.worker_name}</td>
                                <td>${e.car || '-'}</td>
                                <td>${e.resource_name}</td>
                                <td style="text-align: center;" class="gold-val">${e.resource_amount} L</td>
                                <td><button class="btn-del" onclick="deleteScheduleItem(${e.id})">✖</button></td>
                            </tr>`).join("")}
                    </tbody>
                </table>`;

            // 3. Darba stundu atskaite
            const hoursSec = document.getElementById('v-report-hours');
            let fSum = daySummary.filter(e => 
                (!hoursSec.querySelector('.year-sel').value || (e.datums && e.datums.includes(hoursSec.querySelector('.year-sel').value))) &&
                (!hoursSec.querySelector('.month-sel').value || e.month === hoursSec.querySelector('.month-sel').value) &&
                (!hoursSec.querySelector('.worker-sel').value || e.darbinieks === hoursSec.querySelector('.worker-sel').value)
            );
            
            document.getElementById('totalDayHoursValue').innerText = fSum.reduce((s,i) => s + parseFloat(i.stundas || 0), 0).toFixed(2) + " h";
            document.getElementById('daySummaryContainer').innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Darbinieks</th>
                            <th>Datums</th>
                            <th>Sākums</th>
                            <th>Beigas</th>
                            <th style="text-align: center;">Stundas</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${fSum.map(e => `
                            <tr>
                                <td>${e.darbinieks}</td>
                                <td>${e.datums}</td>
                                <td>${e.sāka_darbu}</td>
                                <td>${e.beidza_darbu}</td>
                                <td style="text-align: center;" class="gold-val">${parseFloat(e.stundas || 0).toFixed(2)}</td>
                            </tr>`).join("")}
                    </tbody>
                </table>`;
        }

        async function addNewWorker() { const n = prompt("Vārds Uzvārds:"); if(n) { await fetch('/api/workers', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:n})}); loadData(); } }
        async function addNewItem(url, msg, extra={}) { const n = prompt(msg); if(n) { await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:n, ...extra})}); loadData(); } }
        async function deleteItem(url, name) { if(confirm(`Dzēst ${name}?`)) { await fetch(`${url}/${encodeURIComponent(name)}`, {method:'DELETE'}); loadData(); } }
        async function adjustRes(id, action) { const val = parseFloat(document.getElementById(`in-${id}`).value); if(!val) return; await fetch(`/api/resource-types/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, amount:val})}); loadData(); }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }

        loadData();
    </script>
</body>
</html>
