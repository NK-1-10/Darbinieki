<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">

<style>
    @media (max-width: 480px) {
        .login-card { margin-top: 60px !important; }
    }
</style>
<style>
    @media (max-width: 480px) {
        body.login-page::before { display: none; }
        body.login-page {
            align-items: flex-start !important;
            padding: 20px 16px 24px !important;
        }
        .login-card {
            margin-top: 4px !important;
            padding: 22px 18px !important;
        }
        .login-card label { font-size: 0.95rem !important; }
        .login-card input { min-height: 46px !important; font-size: 0.95rem !important; }
        .login-card button { min-height: 50px !important; font-size: 0.95rem !important; }
        .hint { font-size: 0.82rem !important; margin-top: 14px !important; }
    }
</style>
</head>
<body class="login-page">

  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="login-field">
      <label for="username">Lietotājvārds</label>
      <input id="username" name="username" type="text" required />
    </div>

    <div class="login-field">
      <label for="password">Parole</label>
      <input id="password" name="password" type="password" required />
    </div>

    <button type="submit">Ielogoties</button>
  </form>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const user = await response.json();

                // Paroles maiņas loģika
                if (user.needsParoleChange) {
                    const newPass = prompt("Jums jānomaina pagaidu parole:");
                    if (newPass) {
                        const changeRes = await fetch('/api/change-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: user.name, newParole: newPass.trim() })
                        });
                        if (changeRes.ok) {
                            alert("Parole nomainīta! Ielogojieties vēlreiz.");
                            window.location.reload();
                            return;
                        }
                    }
                    alert("Maiņa obligāta!"); return;
                }

                // SAGLABĀŠANA: Šis ir kritiski svarīgi worker.html lapai
                // Admins un darbinieks glabājas atsevišķi, lai paralēla lietošana netraucē
                if (user.role === "admin" || user.role === "viewer") {
                    sessionStorage.setItem("loggedInAdmin", JSON.stringify(user));
                } else {
                    localStorage.setItem("loggedInUser", JSON.stringify(user));
                }
                
                // Pārvirzīšana
                window.location.href = (user.role === "admin" || user.role === "viewer") ? "admin.html" : "worker.html";

            } else {
                const err = await response.json();
                alert(err.error || "Kļūda!");
            }
        } catch (err) {
            alert("Servera kļūda.");
        }
    });
});
</script>
</body>
</html>
