<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">

</head>
<body class="login-page">

  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="login-field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required />
    </div>

    <div class="login-field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />
    </div>

    <button type="submit">Log in</button>
    <p class="hint">If using a temporary password, you will be prompted to set a new password.</p>
  </form>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const user = await response.json();

                // Paroles maiņas loģika
                if (user.needsPasswordChange) {
                    const newPass = prompt("Jums jānomaina pagaidu parole:");
                    if (newPass) {
                        const changeRes = await fetch('/api/change-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: user.name, newPassword: newPass.trim() })
                        });
                        if (changeRes.ok) {
                            alert("Parole nomainīta! Ielogojieties vēlreiz.");
                            window.location.reload();
                            return;
                        }
                    }
                    alert("Maiņa obligāta!"); return;
                }

                // SAGLABĀŠANA: Šis ir kritiski svarīgi worker.html lapai
                localStorage.setItem("loggedInUser", JSON.stringify(user));
                
                // Pārvirzīšana
                window.location.href = user.role === "admin" ? "admin.html" : "worker.html";

            } else {
                const err = await response.json();
                alert(err.error || "Kļūda!");
            }
        } catch (err) {
            alert("Servera kļūda.");
        }
    });
});
</script>
</body>
</html>
